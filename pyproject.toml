[project]
name = "screen-translator"
version = "0.1.0"
description = "Dịch chữ tiếng Nhật trên màn hình sang tiếng Anh, chạy offline (OCR + Ollama)"
authors = [
    { name = "Dangchaubaominh", email = "142299490+Dangchaubaominh@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "manga-ocr>=0.1.14",
    "mss>=10.2.0",
    "ollama>=0.6",
    "oneocr>=1.0.12",
    "pillow>=11",
    "pyside6-essentials>=6.12.0",
    "torch>=2.6",
]

[dependency-groups]
bench = ["sacrebleu>=2.4"]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# PyTorch bản CUDA 12.6: driver 566 của máy hỗ trợ tối đa CUDA 12.7
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
screen-translator = "screen_translator:main"

# Cùng app nhưng không mở cửa sổ console: shortcut ở menu Start / Desktop / Startup trỏ vào đây
[project.gui-scripts]
screen-translator-gui = "screen_translator:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
